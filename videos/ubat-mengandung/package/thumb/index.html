<!doctype html><html><head><meta charset="utf-8"><style>
/* TikTok cover 1080x1920. Everything that matters sits inside the profile-grid crop (3:4, y 240-1680). */
@font-face{font-family:"Anton";src:url("Anton.woff2") format("woff2");font-display:block}
@font-face{font-family:"PJS";src:url("PlusJakartaSans-800.woff2") format("woff2");font-weight:800;font-display:block}
*{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#041920}
#t{position:relative;width:1080px;height:1920px;overflow:hidden}
.full{position:absolute;left:0;top:0;width:1080px;height:1920px}
#bg{filter:saturate(1.05) brightness(.97)}
/* the phone's front camera mirrored the footage (shirt reads 'NERZA RD'): flip photo + matte so it reads DR AZREN */
#bg,#fg{transform:scaleX(-1)}
/* soft teal wash over the bright wall so the hero pops; dark floor under the chest text */
#wash{background:linear-gradient(180deg,rgba(8,50,60,.30) 0%,rgba(8,50,60,.10) 22%,rgba(0,0,0,0) 40%,rgba(0,0,0,0) 58%,rgba(4,25,32,.55) 74%,rgba(4,25,32,.88) 90%,rgba(4,25,32,.95) 100%)}
.anton{font-family:"Anton";text-transform:uppercase;line-height:.92;text-align:center;position:absolute;left:0;right:0}
/* behind the head: the matte (fg) is layered over it */
#hero{top:262px;font-size:300px;color:#0E5E6F;letter-spacing:.005em;
  -webkit-text-stroke:5px rgba(255,248,238,.85);paint-order:stroke fill;text-shadow:0 14px 40px rgba(0,0,0,.25)}
#fg{filter:drop-shadow(0 18px 30px rgba(0,0,0,.35))}
#kick{position:absolute;left:0;right:0;top:1592px;text-align:center}
#kick span{display:inline-block;font-family:"PJS";font-weight:800;font-size:34px;letter-spacing:.08em;text-transform:uppercase;
  color:#08323C;background:#5EEAD4;padding:12px 28px 10px;border-radius:999px;box-shadow:0 10px 26px rgba(0,0,0,.3)}
#psik{top:1300px;font-size:150px;color:#FFF8EE;-webkit-text-stroke:7px rgba(0,0,0,.6);paint-order:stroke fill;
  text-shadow:0 8px 0 rgba(0,0,0,.35),0 14px 36px rgba(0,0,0,.6)}
#warn{position:absolute;left:0;right:0;top:1468px;text-align:center}
#warn span{display:inline-flex;align-items:center;gap:18px;font-family:"PJS";font-weight:800;font-size:62px;color:#fff;background:#E5484D;
  padding:16px 38px 14px;border-radius:22px;transform:rotate(-2.5deg);box-shadow:0 16px 40px rgba(0,0,0,.45)}
#warn svg{width:62px;height:62px}
#tag{position:absolute;right:56px;top:1618px;font-family:"PJS";font-weight:800;font-size:30px;color:rgba(255,248,238,.9)}
</style></head><body><div id="t">
<img id="bg" class="full" src="bg.png">
<div id="wash" class="full"></div>
<div class="anton" id="hero">10 UBAT</div>
<img id="fg" class="full" src="fg.png">
<div id="kick"><span>Doktor psikiatri jelaskan</span></div>
<div class="anton" id="psik">Psikiatri</div>
<div id="warn"><span><svg viewBox="0 0 48 48"><g stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M24 6L4 41h40z"/><path d="M24 18v11M24 35v.01"/></g></svg>Hati-hati bila hamil</span></div>
</div></body></html>
