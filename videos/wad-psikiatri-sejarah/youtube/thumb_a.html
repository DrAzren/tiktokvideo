<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"PJS";src:url("../doc/public/fonts/PlusJakartaSans-800.woff2") format("woff2");font-weight:800;font-display:block}
@font-face{font-family:"PJS";src:url("../doc/public/fonts/PlusJakartaSans-700.woff2") format("woff2");font-weight:700;font-display:block}
@font-face{font-family:"Cinzel";src:url("../doc/public/fonts/Cinzel-600.woff2") format("woff2");font-weight:600;font-display:block}
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#000}
.l,.r{position:absolute;inset:0;background-size:cover;background-position:center}
.l{background-image:url("../doc/public/img/31_horror_set.jpg");filter:saturate(.85) brightness(.9) contrast(1.2);clip-path:polygon(0 0,58% 0,44% 100%,0 100%);background-position:30% 50%}
.r{background-image:url("../doc/public/img/23_modern_ward.jpg");filter:brightness(1.05) saturate(1.1);clip-path:polygon(58% 0,100% 0,100% 100%,44% 100%);background-position:70% 50%}
.cut{position:absolute;inset:0;background:#F4EBD8;clip-path:polygon(57.4% 0,58.6% 0,44.6% 100%,43.4% 100%)}
.shade{position:absolute;left:0;right:0;bottom:0;height:48%;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.55) 45%,rgba(0,0,0,.85) 100%)}
.tag{position:absolute;top:34px;font-family:"PJS";font-weight:800;font-size:40px;letter-spacing:.08em;color:#fff;padding:8px 22px;border-radius:8px}
.t1{left:36px;background:#B3352B}.t2{right:36px;background:#0E8F86}
.x{position:absolute;left:96px;top:100px;font-family:"PJS";font-weight:800;font-size:120px;color:#ff3b30;text-shadow:0 6px 18px rgba(0,0,0,.6)}
.ok{position:absolute;right:86px;top:100px;font-family:"PJS";font-weight:800;font-size:120px;color:#5CF2D6;text-shadow:0 6px 18px rgba(0,0,0,.5)}
.h1{position:absolute;left:0;right:0;text-align:center;bottom:168px;font-family:"PJS";font-weight:800;font-size:92px;line-height:1;color:#fff;letter-spacing:-.01em;
  text-shadow:0 4px 0 #000,0 0 24px rgba(0,0,0,.7)}
.h2{position:absolute;left:0;right:0;text-align:center;bottom:30px;font-family:"PJS";font-weight:800;font-size:150px;line-height:1;color:#FFD21F;letter-spacing:-.02em;
  -webkit-text-stroke:4px #111;paint-order:stroke fill;text-shadow:0 8px 0 #000,0 0 30px rgba(0,0,0,.6)}
.dr{position:absolute;left:320px;top:22px;width:640px;-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 18%,#000 84%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 18%,#000 84%,transparent 100%);filter:drop-shadow(0 10px 30px rgba(0,0,0,.55))}
.dr img{width:100%;display:block}
.br{position:absolute;right:30px;bottom:30px;font-family:"PJS";font-weight:700;font-size:22px;letter-spacing:.3em;color:#F4EBD8;opacity:.9}
</style></head><body>
<div class="l"></div><div class="r"></div><div class="cut"></div><div class="dr"><img src="dr_azren_cutout.png"/></div><div class="shade"></div>
<div class="tag t1">MITOS</div><div class="tag t2">REALITI</div>
<div class="x">✕</div><div class="ok">✓</div>
<div class="h1">WAD PSIKIATRI</div><div class="h2">MENAKUTKAN?</div>
</body></html>
